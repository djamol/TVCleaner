plugins {
    id 'com.android.application'
}

android {
    namespace 'com.patilweb.streambrowser'
    compileSdk 34

    defaultConfig {
        applicationId 'com.patilweb.streambrowser'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '1.4'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
