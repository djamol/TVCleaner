plugins {
    id 'com.android.application'
}

android {
    namespace 'com.patilweb.tvremap'
    compileSdk 34

    defaultConfig {
        applicationId 'com.patilweb.tvremap'
        minSdk 26
        // Lower target avoids Android 12+ sideload a11y bind restrictions on some boxes.
        targetSdk 29
        versionCode 6
        versionName '2.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
